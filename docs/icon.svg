<!-- Neo. A readable record of the shipped icon; the PNG sizes and the .icns are
     produced by scripts/make-icon.mjs, which draws the same shapes from distance
     fields so that every size is rendered natively rather than downscaled. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Two adjacent hues. Complements grey out where they meet; neighbours stay
         saturated, which is what keeps this vivid all the way across. -->
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="light" cx="0.18" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS leaves a margin around the squircle; 100px on 1024 matches the system icons. -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#face)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#light)"/>

  <!-- Three steps on a diagonal: separate things, held in one line of sight. -->
  <g fill="#ffffff">
    <rect x="294" y="574" width="156" height="156" rx="26"/>
    <rect x="434" y="434" width="156" height="156" rx="26"/>
    <rect x="574" y="294" width="156" height="156" rx="26"/>
  </g>
</svg>
