name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            args: --mac --x64 --arm64
          - os: windows-latest
            name: Windows
            args: --win --x64
          - os: ubuntu-latest
            name: Linux
            args: --linux --x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron-builder only packages what is already in out/; it does not
      # compile anything itself.
      - name: Typecheck and compile
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # There is no Developer ID certificate in CI, so do not go looking for
          # one in the keychain — electron-builder hangs rather than failing when
          # it does. The macOS artifacts are unsigned; the README says so.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The zip goes up with the rest, and it is not optional: it is the file the app
      # downloads to replace itself. A release without one is a release nobody
      # already running Neo will ever be offered. See `main/lib/updater.ts`.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The release notes are the changelog file this version shipped with, so the
      # sentence read *before* updating and the one the app shows *after* it are the
      # same sentence rather than two descriptions that drift apart. Illustrations are
      # relative paths — they resolve inside the app, where the files are bundled — so
      # they are rewritten to raw URLs here, and only here.
      #
      # A version with no file is a release, not a mistake. Changelogs are for the
      # arrivals somebody would want to read about; a fortnight of fixes and small
      # refinements does not become one by being written up, and a rule that demanded
      # one for every tag only ever produced pages nobody read. So the fallback below
      # says the true and boring thing, and the app's *What changed* screen stays shut
      # for that version rather than opening on a heading with nothing under it.
      - name: Take the release notes from the changelog
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          FILE="changelog/$VERSION.md"
          if [ -f "$FILE" ]; then
            RAW="https://raw.githubusercontent.com/$REPO/$TAG/changelog/"
            # Drop the front matter, then point every relative image at the tag it
            # belongs to — a `main` URL would go stale the moment the next release lands.
            awk 'NR==1 && /^---$/ {front=1; next} front && /^---$/ {front=0; next} !front' "$FILE" \
              | sed -E "s#\]\((\./)?(media/[^)]+)\)#](${RAW}\2)#g" > notes.md
          else
            echo "No changelog/$VERSION.md — releasing without one."
            printf '%s\n' 'Fixes and refinements. Nothing in this one needed a page of its own.' > notes.md
          fi
          cat notes.md

      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # The release is made here if nobody made it first, titled from the
          # changelog's own front matter when there is one — a version without a
          # changelog is just its number. `edit` alone fails with "release not
          # found" after three platforms have spent twenty minutes building.
          FILE="changelog/${TAG#v}.md"
          TITLE=""
          if [ -f "$FILE" ]; then
            TITLE="$(sed -nE '1,/^---$/!d; s/^title:[[:space:]]*//p' "$FILE" | head -1)"
          fi
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --verify-tag \
              --title "Neo ${TAG#v}${TITLE:+ — $TITLE}" --notes-file notes.md
          else
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          fi
          # -print0/-0 rather than $(find ...): artifact names can contain spaces,
          # and unquoted word splitting turns one file into two missing ones.
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*-mac.zip' -o -name '*.exe' -o -name '*.AppImage' \) -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber
