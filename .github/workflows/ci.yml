name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The whole run is seconds. A job still going after twenty minutes is a job
    # that has hung, and without this it hangs for the full six hours — billed at
    # ten times the rate on macOS, and leaving nothing readable, because a log is
    # only published once the run is over.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # dev-branding runs on postinstall and renames the local Electron bundle.
      # It is a macOS-only cosmetic step and is a no-op elsewhere.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The backend runs headless in plain Node with Electron stubbed out,
      # so there is no display to set up.
      - name: Verify the backend
        run: npm run verify

      - name: Verify an upgrade from an older schema
        run: npm run verify:upgrade
