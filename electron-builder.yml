appId: com.svartdal.neo
productName: Neo
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
# PGlite ships a WebAssembly build plus its data file; both must stay real files
# on disk rather than being packed into the asar archive.
asarUnpack:
  - node_modules/@electric-sql/pglite/**
# The MCP connector is run by Claude Desktop, not by us, so it has to be a real file
# beside the app rather than a member of the asar archive. Installing the .mcpb is the
# ordinary way in; this is the copy a hand-written claude_desktop_config.json points at.
extraResources:
  - from: out/mcp/neo-mcp.mjs
    to: mcp/neo-mcp.mjs
  # The native audio tap, for the same reason: it is spawned as a process, so it has
  # to be a real file beside the app rather than a member of the asar archive. Absent
  # on a machine that built without a Swift toolchain, which every path that uses it
  # already copes with.
  - from: out/native/neo-audiotap
    to: native/neo-audiotap
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # macOS kills an app that asks for the microphone without declaring why, and the
  # sentence below is the one shown in its own permission sheet — so it says what
  # the recording is for rather than "Neo would like to access the microphone".
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Neo records the meetings you ask it to, so it can write out what was said and
      pull the decisions and commitments out of it. Recordings stay in your own
      Documents folder.
    # Core Audio process taps need this, and there is no public API to ask for the
    # permission up front — macOS shows its own sheet the first time a tap is opened,
    # and this is the sentence on it.
    NSAudioCaptureUsageDescription: >-
      Neo records what your computer is playing, so a recorded meeting captures the
      people on the call and not only your own microphone.
  target:
    - dmg
    - zip
win:
  target: nsis

# Without this the installer is called "Neo Setup 1.0.0.exe". The spaces break
# every shell one-liner that handles release artifacts, and the docs promise a
# hyphenated name.
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target: AppImage
  category: Office
